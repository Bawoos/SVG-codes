<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>On Page Load</title>
  </head>
  <body>
    <svg
      svg
      xmlns="http://www.w3.org/2000/svg"
      xmlns:xlink="http://www.w3.org/1999/xlink"
      width="100%"
      height="100%"
      onload="startup()"
      onmousemove="moveIt(evt)"
    >
      <script>
        //<![CDATA[
        function startup() {
          C = document.getElementById("C");
        }

        function moveIt(evt) {
          C.setAttributeNS(null, "cx", evt.clientX);
          C.setAttributeNS(null, "cy", evt.clientY);
        }
        //]]>
      </script>

      <circle
        cx="60"
        cy="60"
        r="40"
        fill="white"
        stroke="black"
        stroke-width="3"
      />
      <circle
        id="C"
        cx="60"
        cy="60"
        r="22"
        fill="darkgrey"
        opacity="0.7"
        stroke="lightgrey"
        stroke-width="8"
      />
    </svg>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG Christmas Ball</title>
  </head>
  <body>
    <svg width="200" height="200">
      <defs>
        <radialGradient id="shine" cx="0.25" cy="0.25" r="0.35">
          <stop offset="0%" stop-color="#e3a8b0" />
          <stop offset="100%" stop-color="#D1495B" />
        </radialGradient>
      </defs>

      <circle cx="100" cy="120" r="70" fill="url(#shine)" />
      <circle
        cx="100"
        cy="25"
        r="12"
        fill="none"
        stroke="#F79257"
        stroke-width="2"
      />
      <rect x="82" y="35" width="36" height="20" fill="#F79257" />
    </svg>
  </body>
</html>

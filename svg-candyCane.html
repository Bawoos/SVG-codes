<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG Candy Cane</title>
  </head>
  <body>
    <svg width="200" height="400" viewBox="-100 -200 200 400">
      <path
        d="
        M 50 120
        L 50 -80
        A 50 50 0 0 0 -50 -80"
        fill="none"
        stroke="black"
        stroke-width="45"
        stroke-linecap="round"
      />

      <path
        d="
        M 50 120
        L 50 -80
        A 50 50 0 0 0 -50 -80"
        fill="none"
        stroke="red"
        stroke-width="35"
        stroke-linecap="round"
      />

      <path
        d="
        M 50 120
        L 50 -80
        A 50 50 0 0 0 -50 -80"
        fill="none"
        stroke="white"
        stroke-width="35"
        stroke-dasharray="30 30"
      />
    </svg>
  </body>
</html>

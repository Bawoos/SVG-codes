<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG 2113</title>
  </head>
  <body>
    <svg
      width="800"
      height="800"
      viewBox="0 0 800 800"
      xmlns="http://www.w3.org/2000/svg"
    >
      <ellipse cx="280" cy="175" rx="100" ry="50" fill="blue">
        <animateTransform
          attributeName="transform"
          type="rotate"
          dur="2.5"
          from="360,280,175"
          to="0,280,175"
          repeatCount="indefinite"
        />
      </ellipse>
    </svg>
  </body>
</html>

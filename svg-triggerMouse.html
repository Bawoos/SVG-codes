<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG 2113</title>
  </head>
  <body>
    <svg
      width="800"
      height="800"
      viewBox="0 0 800 800"
      xmlns="http://www.w3.org/2000/svg"
    >
      <text x="35%" y="35%" font-size="30" fill="red">
        <animate
          attributeName="font-size"
          begin="click"
          values="8;50;8"
          dur="6"
          repeatCount="indefinite"
        />
        Click
      </text>
    </svg>
  </body>

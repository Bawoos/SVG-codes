<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG 2113</title>
  </head>
  <body>
    <svg
      width="800"
      height="800"
      viewBox="0 0 800 800"
      xmlns="http://www.w3.org/2000/svg"
    >
      <g id="stop" fill="#f88">
        <rect
          id="button"
          x="250"
          y="200"
          height="30"
          width="75"
          fill="inherit"
        />
        <text x="260" y="220" font-size="20" fill="red">STOP</text>
      </g>

      <g id="go" transform="translate(-100,0)" fill="#8f8">
        <use xlink:href="#button" />
        <text x="270" y="220" font-size="20" fill="green">GO</text>
      </g>
      <path
        id="curve"
        stroke="black"
        fill="none"
        stroke-width="5"
        d="M 110,150 C 300,80 400,300 450,100 500,-100 -90,220 110,150"
      />

      <ellipse
        x="200"
        y="100"
        rx="20"
        ry="12"
        fill="#aaa"
        stroke="#666"
        stroke-width="2"
        opacity=".8"
      >
        <animateMotion
          id="One"
          dur="2s"
          end="stop.click"
          fill="freeze"
          rotate="auto"
          repeatCount="indefinite"
        >
          <mpath href="#curve" />
        </animateMotion>
      </ellipse>
    </svg>
  </body>
</html>

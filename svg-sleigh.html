    <title>SVG Sleigh</title>

  <body>
    <svg width="400" height="200" viewBox="-200 -100 400 200" fill="none">

        stroke-width="4"
        d="M-200 80 L -80 80 Q 80 80 70 -10 A 70 70 0 0 0 -70 -10 Q -80 80 80 80 L 200 80"
      />

      <g class="sleigh">
        <path
          d="
      M -30 -2 L 30 -2 A 10 10 0 0 0 30 -22
      M -20 -2 L -20 -17
      M 20 -2 L 20 -17"
          stroke="#AF6455"

        />

      </g>
    </svg>

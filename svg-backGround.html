<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG Background</title>
    <link rel="stylesheet" href="svg-background.css" />
  </head>
  <body>
    <div class="background">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="50"
        height="50"
        viewBox="0 0 120 120"
      >
        <polyline
          fill="none"
          stroke="#0c5c4c"
          stroke-width="42.4"
          points="-30 0 60 90 150 0"
        />
      </svg>
    </div>
  </body>
</html>
